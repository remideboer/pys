[project]
name = "python_transpiler"
version = "0.1.0"
description = "A small educational transpiler from a Python-like student language to Python."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
keywords = ["python", "transpiler", "education", "demo"]

[project.scripts]
python-transpiler = "transpiler.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
