name: Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Test transpiler
        run: python -m pytest -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install locked extension toolchain
        working-directory: pys-language
        run: npm ci --ignore-scripts

      - name: Test extension helpers
        working-directory: pys-language
        run: npm test

      - name: Package VSIX and ELO zip
        working-directory: pys-language
        run: npm run package:elo

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pys-language-vsix
          path: pys-language/*.vsix
          if-no-files-found: error

      - name: Upload ELO zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pys-student-elo
          path: dist/pys-student-*.zip
          if-no-files-found: error
