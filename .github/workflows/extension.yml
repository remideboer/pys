name: Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Test transpiler
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package VSIX and ELO zip
        working-directory: pys-language
        run: npm run package:elo

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: pys-language-vsix
          path: pys-language/*.vsix
          if-no-files-found: error

      - name: Upload ELO zip
        uses: actions/upload-artifact@v4
        with:
          name: pys-student-elo
          path: dist/pys-student-*.zip
          if-no-files-found: error
