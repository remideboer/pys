# Publish the beginner book (book/html) to GitHub Pages.
# Repo setting: Settings → Pages → Source = GitHub Actions
# Site URL (project pages): https://remideboer.github.io/pys/

name: Pages — beginner book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/pages-book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-book
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install markdown
        run: python -m pip install --upgrade pip && python -m pip install markdown

      - name: Build book HTML
        working-directory: book
        run: python build_html.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: book/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
