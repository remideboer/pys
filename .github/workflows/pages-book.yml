# Publish the beginner book (book/html) to GitHub Pages.
# Repo setting: Settings → Pages → Source = GitHub Actions
# Site URL (project pages): https://remideboer.github.io/pys/

name: Pages — beginner book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/pages-book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-book
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install markdown
        run: python -m pip install --upgrade pip && python -m pip install markdown

      - name: Build book HTML
        working-directory: book
        run: python build_html.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages still loads Node's deprecated punycode via an old
    # @actions/artifact (upstream: actions/deploy-pages#413). Mute only that
    # code until a release ships the artifact v6+ rebuild.
    env:
      NODE_OPTIONS: --disable-warning=DEP0040
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
