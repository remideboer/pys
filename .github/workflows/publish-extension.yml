name: Publish extension

# Trunk-based extension release:
#   1. Bump package.json version + update RELEASE_NOTES.md on main (CI green)
#   2. git tag extension-v<version> && git push origin extension-v<version>
# GitHub Release always gets VSIX + student zip with curated notes.
# Marketplace / Open VSX publish only when the matching secret is set.

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to run the release package path (Marketplace only if VSCE_PAT is set)"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Test transpiler
        run: python -m pytest -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install locked extension toolchain
        working-directory: pys-language
        run: npm ci --ignore-scripts

      - name: Test extension helpers
        working-directory: pys-language
        run: npm test

      - name: Read extension version
        id: ver
        working-directory: pys-language
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="extension-v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag '$TAG' must be '$EXPECTED' (matches package.json version)."
            exit 1
          fi

      - name: Confirm manual publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "Aborted: set confirm input to exactly 'publish'."
            exit 1
          fi

      - name: Require RELEASE_NOTES.md for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES="pys-language/RELEASE_NOTES.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing $NOTES — write release notes before tagging."
            exit 1
          fi
          if ! grep -qF "$VERSION" "$NOTES"; then
            echo "$NOTES must mention version $VERSION (update notes with the version bump)."
            exit 1
          fi

      - name: Package VSIX and ELO zip
        working-directory: pys-language
        run: npm run package:elo

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pys-language-vsix-${{ steps.ver.outputs.version }}
          path: pys-language/*.vsix
          if-no-files-found: error

      - name: Upload ELO zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pys-student-elo-${{ steps.ver.outputs.version }}
          path: dist/pys-student-*.zip
          if-no-files-found: error

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pys-release-notes-${{ steps.ver.outputs.version }}
          path: pys-language/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install locked publishing tools
        working-directory: pys-language
        run: npm ci --ignore-scripts

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pys-language-vsix-${{ needs.build.outputs.version }}
          path: release-artifacts/vsix

      - name: Download ELO artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pys-student-elo-${{ needs.build.outputs.version }}
          path: release-artifacts/elo

      - name: Download release notes artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pys-release-notes-${{ needs.build.outputs.version }}
          path: release-artifacts/notes

      - name: Build GitHub Release body
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            cat release-artifacts/notes/RELEASE_NOTES.md
            echo ""
            echo "---"
            echo ""
            echo "## Install"
            echo "- **Marketplace:** \`ext install remideboer.pys-language\`"
            echo "- **ELO / offline:** download \`pys-student-${VERSION}.zip\`, unzip, run \`install.cmd\`"
            echo ""
            echo "Requires Python 3.10+ on PATH. Extension includes the bundled transpiler."
          } > release-artifacts/RELEASE_BODY.md

      - name: Publish to Visual Studio Marketplace
        working-directory: pys-language
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set; skipping Marketplace (GitHub Release zip still ships)."
            exit 0
          fi
          VSIX=$(ls -1 ../release-artifacts/vsix/*.vsix)
          npx --no-install vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"

      - name: Optional Open VSX publish
        working-directory: pys-language
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set; skipping Open VSX."
            exit 0
          fi
          VSIX=$(ls -1 ../release-artifacts/vsix/*.vsix)
          npx --no-install ovsx publish "$VSIX" --pat "$OVSX_PAT"

      - name: GitHub Release (notes + VSIX + ELO zip)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: PYS Language Support v${{ needs.build.outputs.version }}
          body_path: release-artifacts/RELEASE_BODY.md
          generate_release_notes: true
          files: |
            release-artifacts/vsix/*.vsix
            release-artifacts/elo/*.zip
          fail_on_unmatched_files: true
